aid: proprio
name: Proprio
description: >-
  Proprio is a Seattle-based surgical technology company modernizing how surgery
  is predicted, performed, and perfected by combining physician expertise with
  immersive, intelligent technology. Its FDA-cleared Paradigm platform fuses
  proprietary light-field imaging, an array of advanced sensors (the Prism sensor
  array), and artificial intelligence to build a continuous, real-time 3D model of
  anatomy during spine and orthopedic procedures. Paradigm delivers radiation-free
  intraoperative measurement, per-vertebra registration, and structured surgical
  data capture, reducing radiation exposure while streamlining surgical workflows.
  Founded in 2016 and backed by DCVC, Proprio is commercializing surgical
  navigation, real-time surgical intelligence, and a growing surgical data
  registry. Proprio is a hardware- and software-based medical device company; it
  does not currently publish a public developer API, SDK, or developer portal.
